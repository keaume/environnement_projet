        function applyFilters() {
            var muni = document.getElementById("filter-muni").value;
            var typeEvt = document.getElementById("filter-type").value;
            var hideApprox = document.getElementById("filter-hide-approx").checked;

            clusterGroup.clearLayers();

            var count = 0;

            markersData.forEach(function(item) {
                var keep = true;

                if (muni && item.municipalite !== muni) keep = false;
                if (typeEvt && item.type_evt !== typeEvt) keep = false;
                if (hideApprox && item.approx) keep = false;

                if (keep) {
                    clusterGroup.addLayer(item.marker);
                    count++;
                }
            });

            var countEl = document.getElementById("filters-count");
            if (countEl) {
                countEl.innerText = count + " point(s) affiché(s)";
            }
        }

        function resetFilters() {
            document.getElementById("filter-muni").value = "";
            document.getElementById("filter-type").value = "";
            document.getElementById("filter-hide-approx").checked = false;
            applyFilters();

    <script>
    setTimeout(function() {
        var map = map_3bbe8a8fd6410cd5cf34568f91934627;
        var searchMarker = null;

        function geocodeAndFly(query) {
            var statusEl = document.getElementById("search-status");
            statusEl.innerText = "Recherche en cours...";

            var url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ca&q=" + encodeURIComponent(query);

            fetch(url, { headers: { "Accept-Language": "fr" } })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (!data || data.length === 0) {
                        statusEl.innerText = "Adresse introuvable.";
                        return;
                    }
                    var lat = parseFloat(data[0].lat);
                    var lon = parseFloat(data[0].lon);

                    if (searchMarker) {
                        map.removeLayer(searchMarker);
                    }
                    searchMarker = L.marker([lat, lon], {
                        icon: L.AwesomeMarkers.icon({
                            markerColor: "blue",
                            iconColor: "white",
                            icon: "map-marker",
                            prefix: "glyphicon",
                        })
                    }).addTo(map);
                    searchMarker.bindPopup(data[0].display_name).openPopup();

                    map.flyTo([lat, lon], 16);
                    statusEl.innerText = "";
                })
                .catch(function() {
                    statusEl.innerText = "Erreur de recherche.";
                });
        }

        var btn = document.getElementById("search-btn");
        var input = document.getElementById("search-input");

        if (btn) btn.addEventListener("click", function() {
            var q = input.value.trim();
            if (q) geocodeAndFly(q);
        });

        if (input) input.addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                var q = input.value.trim();
                if (q) geocodeAndFly(q);
            }
        });
    }, 300);
    </script>
